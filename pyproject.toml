[project]
name = "continuous-thought-machines"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
dependencies = [
    "numpy",
    "torch>=2.8",
    "torchvision",
    "matplotlib",
    "seaborn",
    "tqdm",
    "opencv-python",
    "imageio",
    "scikit-learn",
    "umap-learn",
    "python-dotenv",
    "gymnasium",
    "minigrid",
    "datasets",
    "autoclip",
    "timm>=1.0.22",
    "wandb>=0.23.0",
    "pytest>=9.0.2",
    "fvcore>=0.1.5",
    "tensorboard>=2.20.0",
]
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.per-file-ignores]
"tasks/image_classification/*" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["Cattn.py"]
